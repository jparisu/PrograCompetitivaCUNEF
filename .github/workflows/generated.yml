name: Generated files

# Verifies that every DERIVED file is up to date — this is a PR gate, NOT an
# auto-commit. If it fails, run `python tools/gen.py generate` locally and commit
# the result (the failing check names exactly which tooling is stale).
#
# It is deliberately a SEPARATE workflow from Documentation (docs.yml) so its
# pass/fail is reported as its own status check, independent of the build/deploy.
# It covers ALL generation tooling in one interpretable summary — code styles,
# test fixtures, overview data, taxonomy, nav, and the cheatsheet .tex — and needs
# no LaTeX (the cheatsheet PDF is a publish artifact built by docs.yml, not gated).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r tools/requirements.txt
      - name: Generation status (tools/gen.py status)
        run: python tools/gen.py status
