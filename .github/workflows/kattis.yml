name: Kattis standings

# Weekly job: scrape the CUNEF Kattis affiliation ranking and commit the updated
# standings JSON (which keeps a history of dated snapshots). The docs Ranking
# page reads that JSON client-side. Each run appends a snapshot, which is what
# powers the day/week/year position + points deltas over time.
#
# It uses a headless browser (--browser) because Kattis returns 403 to plain
# HTTP scripts. If Kattis still blocks the CI runner, the job does NOT fail; it
# just keeps the previous data. The reliable manual fallback is to save the page
# in a browser and run:  python tools/scrape_kattis.py --html-file page.html

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:       # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: kattis-standings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r tools/requirements.txt playwright

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      # Best-effort: don't fail the job if Kattis blocks the runner; just keep
      # the committed data. `|| true` lets the commit step run either way.
      - name: Scrape standings (headless browser)
        run: |
          python tools/scrape_kattis.py --browser -v \
            || echo "::warning::Kattis scrape failed (likely bot protection); keeping previous standings."

      # Commits only if standings.json actually changed. Pushes made with
      # GITHUB_TOKEN do not retrigger workflows, so there is no loop.
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: update Kattis standings [bot]"
          file_pattern: "docs/assets/data/standings.json"
