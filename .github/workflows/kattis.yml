name: Kattis standings

# Weekly job: scrape the CUNEF Kattis affiliation ranking and commit the updated
# standings JSON to the `standing-data` branch. Fully automatic — no pull
# request, no approval. Runs every Monday morning and on manual dispatch
# (Actions tab -> Run workflow), which does exactly the same thing.
#
# Why a separate branch:
#  - `main` is protected by a repository ruleset and may be written by other
#    actors, so the bot must not push there.
#  - `standing-data` is an ORPHAN branch holding a single file, standings.json,
#    at its root. It shares no history with `main` and contains no workflows and
#    no code, so the bot's write access cannot reach `.github/` or `tools/` even
#    in principle — the branch topology enforces what guards alone used to.
#
# Why there is no deploy step: the ranking page fetches standings.json straight
# from this branch over raw.githubusercontent.com at page load (see DATA_URL in
# docs/assets/js/ranklist.js), so a push here is immediately live. The site never
# needs rebuilding for a data update, and `main`'s copy of standings.json is read
# by nothing.
#
# TODO (trabajo futuro): Make an automation to update the main branch standing
# with the data in the data branch. `main`'s docs/assets/data/standings.json is
# the seed this branch was created from and is now read by nothing, so it drifts
# further out of date with every run here. It still needs a way onto `main` that
# does not require the bot to push there (the ruleset forbids it) — most likely a
# periodic job that opens a PR with the refreshed file for review, which is fine
# for a copy nothing serves.
#
# Each run appends a dated snapshot (history is preserved: a new date is
# appended, a same-date entry is refreshed), because scrape_kattis.py loads the
# JSON at --output and upserts today's entry into it.
#
# It uses a headless browser (--browser) because Kattis returns 403 to plain HTTP
# scripts. If Kattis blocks the CI runner the job does NOT fail; it just keeps the
# previous data. The reliable manual fallback is to save the page in a browser and
# run:  python tools/scrape_kattis.py --html-file page.html

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:       # manual runs from the Actions tab

permissions:
  contents: write          # commit standings.json to the standing-data branch

concurrency:
  group: kattis-standings
  cancel-in-progress: false

env:
  BRANCH: standing-data
  # Where the standing-data checkout lives inside the workspace, and the single
  # file it holds. The scraper reads AND writes this path, so it appends to the
  # branch's own history rather than to main's stale seed copy.
  DATA_DIR: .standings
  DATA_FILE: standings.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # The code (tools/scrape_kattis.py) lives on main...
      - uses: actions/checkout@v4
        with:
          ref: main

      # ...and the data lives on standing-data. Full history so the pre-push
      # rebase below has something to rebase onto.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          path: ${{ env.DATA_DIR }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r tools/requirements.txt playwright

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      # Best-effort: don't fail the job if Kattis blocks the runner; just keep the
      # existing data (the file stays unchanged, so nothing is committed below).
      - name: Scrape standings (headless browser)
        run: |
          python tools/scrape_kattis.py --browser -v \
            --output "$DATA_DIR/$DATA_FILE" \
            || echo "::warning::Kattis scrape failed (likely bot protection); keeping previous standings."

      # This job may ONLY ever change $DATA_FILE on $BRANCH. The branch holding
      # nothing else makes that almost automatic, but the guards stay: each one
      # aborts the run rather than committing something unexpected, because a
      # scrape that writes anything else — or unparseable JSON — is a bug, not a
      # new state worth publishing to a live page.
      - name: Commit to the data branch
        id: commit
        working-directory: ${{ env.DATA_DIR }}
        run: |
          set -euo pipefail

          # The commit our scrape was based on. standings.json is a full document
          # (previous history + today's snapshot upserted into it), so if the
          # branch moves under us our file is derived from stale input and must
          # not be pushed — see the staleness check before the push.
          BASE=$(git rev-parse HEAD)

          # --- Guard 1: nothing outside the data file may have been touched.
          # Covers modified, deleted and newly untracked paths alike.
          UNEXPECTED=$(git status --porcelain --untracked-files=all \
                         -- . ":(exclude)$DATA_FILE")
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Scrape touched files other than $DATA_FILE — refusing to commit."
            echo "$UNEXPECTED"
            exit 1
          fi

          if git diff --quiet -- "$DATA_FILE"; then
            echo "No change in $DATA_FILE — nothing to commit."
            exit 0
          fi

          # --- Guard 2: never publish a standings file we cannot parse, or whose
          # newest snapshot is empty (a scrape that silently found nobody). The
          # page reads this branch directly, so a bad file breaks it immediately.
          python - <<'PY'
          import json, os, sys
          path = os.environ["DATA_FILE"]
          try:
              data = json.load(open(path, encoding="utf-8"))
          except (OSError, ValueError) as exc:
              sys.exit(f"::error::{path} is not valid JSON: {exc}")
          snapshots = data.get("snapshots") or []
          if not snapshots:
              sys.exit(f"::error::{path} has no snapshots")
          newest = max(snapshots, key=lambda s: s.get("date", ""))
          if not (newest.get("members") or []):
              sys.exit(f"::error::newest snapshot ({newest.get('date')}) has no members")
          print(f"{path} OK: {len(snapshots)} snapshots, newest {newest['date']} "
                f"with {len(newest['members'])} members")
          PY

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DATA_FILE"
          git commit -m "data: update Kattis standings [bot]"

          # --- Guard 3: the branch must not have moved while we were scraping.
          # Our standings.json was built from $BASE, so if someone else pushed
          # meanwhile (a manual fix, say) merging the two would risk dropping
          # their edit. Abort instead: the next run re-scrapes on top of their
          # commit and succeeds. This also makes the push below a guaranteed
          # fast-forward, so it never needs --force.
          git fetch --no-tags origin "$BRANCH"
          REMOTE=$(git rev-parse "origin/$BRANCH")
          if [ "$REMOTE" != "$BASE" ]; then
            echo "::error::$BRANCH moved while we were scraping (based on ${BASE:0:7}, remote is now ${REMOTE:0:7}). Nothing pushed — re-run the job to scrape on top of the new data."
            exit 1
          fi

          # --- Guard 4: the push must add exactly one commit touching exactly one
          # file. Checking the whole origin/$BRANCH..HEAD range is the last word
          # on what this job is allowed to publish.
          COMMITS=$(git rev-list --count "origin/$BRANCH..HEAD")
          FILES=$(git diff --name-only "origin/$BRANCH..HEAD")
          if [ "$COMMITS" != "1" ] || [ "$FILES" != "$DATA_FILE" ]; then
            echo "::error::Refusing to push: expected 1 commit changing only $DATA_FILE."
            echo "commits: $COMMITS"
            echo "files:"
            echo "$FILES"
            exit 1
          fi

          git push origin "HEAD:$BRANCH"
          echo "Pushed $(git rev-parse --short HEAD) to $BRANCH — the ranking page serves it directly."
