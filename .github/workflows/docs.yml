name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write        # push the built site to the gh-pages branch
  pull-requests: write   # comment the preview URL on the PR

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt
      - run: pip install -r tools/requirements.txt

      # PR gate: fail if derived files (clean/contest code, test fixtures,
      # overview data) weren't regenerated. Fix locally with `python tools/gen.py generate`.
      - name: Check generated files are up to date
        if: github.event.action != 'closed'
        run: python tools/gen.py status

      # Build (also the PR gate: --strict fails on broken links / missing nav).
      # Skipped when a PR is closed — nothing to build, we only clean up below.
      - name: Build site
        if: github.event.action != 'closed'
        run: mkdocs build --strict

      # Production: pushes to main publish to the root of gh-pages.
      # keep_files preserves the pr-preview/ subdirectories of open PRs.
      - name: Deploy production (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

      # Preview: any branch's PR to main publishes to gh-pages/pr-preview/pr-<N>/
      # and comments the URL on the PR. Auto-removed when the PR is closed.
      - name: Deploy preview (pull request)
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site
