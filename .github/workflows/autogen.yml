name: Autogenerate derived files

# Regenerates the derived files (clean/contest code, test fixtures, overview
# data) from the hand-written sources, and commits them back on main if the
# author forgot to run `python tools/gen.py generate` locally.
#
# The PR gate (that FAILS when derived files are stale) lives in docs.yml as a
# `python tools/gen.py status` step, so contributors are nudged to regenerate.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autogen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autogen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r tools/requirements.txt
      - run: python tools/gen.py generate
      # Pushes made with GITHUB_TOKEN do not retrigger workflows, so no loop.
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate derived files [autogen]"
          file_pattern: "docs/**"
