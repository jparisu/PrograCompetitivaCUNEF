site_name: Programación Competitiva CUNEF
site_description: >-
  Material de programación competitiva de CUNEF (C++ y Python) para concursos tipo ICPC.
site_url: https://jparisu.github.io/PrograCompetitivaCUNEF/
repo_url: https://github.com/jparisu/PrograCompetitivaCUNEF
edit_uri: edit/main/docs/

# NOTE (prototype): pages are hand-authored for now. In the next step they will be
# generated from each algorithm's meta.yaml via mkdocs-macros; the auto-gen of
# clean/contest code and the tests come after that.

# To compare with the classic ReadTheDocs look, temporarily set `name: readthedocs`
# below and run `mkdocs serve` (note: that theme drops tabs, the palette toggle and
# some niceties). We recommend Material, branded with CUNEF orange (see assets/css/theme.css).
hooks:
  - mkdocs_hooks.py           # expands code includes, stripping hidden comments

theme:
  name: material
  custom_dir: overrides       # custom tabs.html for header hover dropdowns
  language: es
  logo: resources/images/logo.jpg
  favicon: resources/images/logo.jpg
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy       # copy button on every code block (req 6)
    - content.code.annotate
    - content.tabs.link
    - navigation.tabs         # top-level sections as colourful tabs
    - navigation.tabs.sticky
    - navigation.top          # back-to-top button
    - navigation.footer       # prev/next links
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Cambiar a modo oscuro }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Cambiar a modo claro }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc: { permalink: "#" }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  # Code includes (--8<-- "path") are expanded by mkdocs_hooks.py so hidden
  # comments (//! / #!) are stripped; see the hook. (Replaces pymdownx.snippets.)
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }                    # C++ / Python tabs
  - pymdownx.emoji:                                               # :material-...: icons
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: [es, en]
  - i18n:
      docs_structure: suffix        # index.md (es, default) + index.en.md (en)
      fallback_to_default: true     # missing translation -> Spanish
      languages:
        - locale: es
          default: true
          name: Español
          build: true
        - locale: en
          name: English
          build: true

# Keep legacy Sphinx files and non-page assets out of the build (they stay on disk).
exclude_docs: |
  **/code/**
  **/test/**
  **/*.yaml
  md/
  conf.py
  requirements.txt
  spelling/
  resources/cheatsheet.md

extra_css:
  - assets/css/theme.css
  - assets/css/ranklist.css
  - assets/css/overview-table.css
  - assets/css/cheatsheet-builder.css

extra_javascript:
  - assets/js/catalog.js          # shared data + filters (must load first)
  - assets/js/page-icon.js        # topic icon next to the page title
  - assets/js/nav-wip.js          # gray out WIP (unimplemented) entries in the sidebar
  - assets/js/nav-dropdown.js
  - assets/js/ranklist.js
  - assets/js/overview-table.js
  - assets/js/graph.js
  - assets/js/matrix.js
  - assets/js/topics.js
  - assets/js/todo.js
  - assets/js/cheatsheet-builder.js

# Two parallel trees — Técnicas and Algoritmos — each grouped by the 5 levels
# (rendered as collapsible dropdowns since navigation.sections is off). The first
# bare page under each section is its landing/index (navigation.indexes).
nav:
  - Inicio: index.md
  - Empezar aquí: start/onboarding.md
  # One unified catalogue: techniques + algorithms + structures, grouped by level.
  # Tree labels carry the type (the level index page is the section landing).
  - Contenidos:
      - Contenidos:
          - algorithms/index.md
          - Temas: topics/index.md
          - Mapa de contenidos: start/matrix.md
          - Grafo de dependencias: start/graph.md
      - Base:
          - algorithms/levels/base/index.md
          - "Bucles — Técnica":
              - algorithms/fundamentals/loops/index.md
              - "En C++": algorithms/fundamentals/loops/cpp.md
              - "En Python": algorithms/fundamentals/loops/python.md
          - "Condicionales — Técnica":
              - algorithms/fundamentals/conditionals/index.md
              - "En C++": algorithms/fundamentals/conditionals/cpp.md
              - "En Python": algorithms/fundamentals/conditionals/python.md
          - "Arrays — Estructura": structures/lists/index.md
          - "Input/Output — Técnica": techniques/io/index.md
          - "Comparaciones — Técnica": techniques/comparisons/index.md
          - "Búsqueda del máximo — Algoritmo": algorithms/max-search/index.md
          - "Sum all — Algoritmo": algorithms/sum-all/index.md
          - "Complejidad (Big-O) — Técnica": techniques/complexity/index.md
