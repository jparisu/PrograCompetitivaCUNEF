id: fenwick-tree
type: structure
topic: data-structures
name:
  es: "Fenwick Tree (BIT)"
  en: Fenwick Tree (BIT)
level: advanced
difficulty: 4.0
techniques: [amortized]
tags: [range-query, point-update, logn]
prerequisites: [lists, prefix-sums]
related: [segment-tree]
current_version: v1
signature:
  type: FenwickTree
  constructor: "FenwickTree(int n)"
  methods:
    - "void update(int index, int delta)"
    - "int query(int index)          # prefix sum [0, index)"
    - "int query_range(int l, int r) # sum [l, r)"
stats:
  complexity:
    build: "O(n)"
    update: "O(log n)"
    query: "O(log n)"
    space: "O(n)"
  use_case:
    es: "Sumas de prefijos con actualizaciones puntuales."
    en: "Prefix sums with point updates."
references:
  - title: "CP-Algorithms: Fenwick Tree"
    url: "https://cp-algorithms.com/data_structures/fenwick.html"
examples:
  - input: |
      5 4
      u 0 3
      u 2 5
      q 0 3
      q 0 5
    expected_output: |
      8
      8
problems:
  - { name: fenwick, judge: kattis, difficulty: 4.0, url: "https://open.kattis.com/problems/fenwick" }
  - { name: supercomputer, judge: kattis, difficulty: 2.7, url: "https://open.kattis.com/problems/supercomputer" }
