<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 150" role="img" aria-label="Búsqueda binaria: se descarta la mitad del rango">
  <style>
    .cell { fill: #ffffff; stroke: #c4530a; stroke-width: 1.5; }
    .cell.dim { opacity: 0.35; }
    .mid { fill: #ec6607; }
    .val { font: 600 15px sans-serif; fill: #1b2733; text-anchor: middle; }
    .midval { fill: #ffffff; }
    .lbl { font: 700 12px sans-serif; text-anchor: middle; fill: currentColor; }
    .idx { font: 12px sans-serif; text-anchor: middle; fill: currentColor; opacity: 0.6; }
  </style>
  <!-- values: 1 3 5 7 9 11 13 15 ; target 9 is at index 4; mid shown at index 3 -->
  <g>
    <rect class="cell dim" x="10"  y="50" width="46" height="46" rx="4"/>
    <rect class="cell dim" x="66"  y="50" width="46" height="46" rx="4"/>
    <rect class="cell dim" x="122" y="50" width="46" height="46" rx="4"/>
    <rect class="cell mid" x="178" y="50" width="46" height="46" rx="4"/>
    <rect class="cell" x="234" y="50" width="46" height="46" rx="4"/>
    <rect class="cell" x="290" y="50" width="46" height="46" rx="4"/>
    <rect class="cell" x="346" y="50" width="46" height="46" rx="4"/>
    <rect class="cell" x="402" y="50" width="46" height="46" rx="4"/>
  </g>
  <g class="val">
    <text x="33"  y="79">1</text>
    <text x="89"  y="79">3</text>
    <text x="145" y="79">5</text>
    <text class="midval" x="201" y="79">7</text>
    <text x="257" y="79">9</text>
    <text x="313" y="79">11</text>
    <text x="369" y="79">13</text>
    <text x="425" y="79">15</text>
  </g>
  <!-- markers -->
  <text class="lbl" x="33"  y="40">lo</text>
  <text class="lbl" x="201" y="40" fill="#ec6607">mid</text>
  <text class="lbl" x="425" y="40">hi</text>
  <text class="idx" x="257" y="120">objetivo = 9 &gt; 7 ⟹ buscar a la derecha</text>
</svg>
