<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img" aria-label="Envolvente convexa de un conjunto de puntos">
  <style>
    .hull { fill: rgba(236, 102, 7, 0.12); stroke: #ec6607; stroke-width: 2.5; stroke-linejoin: round; }
    .pt { fill: currentColor; }
    .pt.hull-pt { fill: #ec6607; }
    .pt.inside { fill: currentColor; opacity: 0.45; }
  </style>
  <!-- hull polygon -->
  <polygon class="hull" points="40,180 120,40 250,70 220,190 90,200"/>
  <!-- hull vertices -->
  <circle class="pt hull-pt" cx="40"  cy="180" r="5"/>
  <circle class="pt hull-pt" cx="120" cy="40"  r="5"/>
  <circle class="pt hull-pt" cx="250" cy="70"  r="5"/>
  <circle class="pt hull-pt" cx="220" cy="190" r="5"/>
  <circle class="pt hull-pt" cx="90"  cy="200" r="5"/>
  <!-- interior points -->
  <circle class="pt inside" cx="130" cy="120" r="4"/>
  <circle class="pt inside" cx="170" cy="95"  r="4"/>
  <circle class="pt inside" cx="150" cy="160" r="4"/>
  <circle class="pt inside" cx="100" cy="130" r="4"/>
</svg>
