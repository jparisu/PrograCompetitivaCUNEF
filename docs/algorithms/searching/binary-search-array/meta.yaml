id: binary-search-array
topic: searching
name:
  es: Búsqueda binaria en un array
  en: Binary search on an array
level: beginner
difficulty: 1.5
techniques: [binary-search]
tags: [search, sorted, logn]
prerequisites: [loops]
current_version: v1
signature:
  es: "binary_search(a, target) -> índice de target, o -1"
  en: "binary_search(a, target) -> index of target, or -1"
stats:
  complexity:
    time: "O(log n)"
    space: "O(1)"
  use_case:
    es: "Encontrar un valor en un array ordenado."
    en: "Find a value in a sorted array."
references:
  - title: "CP-Algorithms: Binary search"
    url: "https://cp-algorithms.com/num_methods/binary_search.html"
examples:
  - input: |
      6
      1 3 5 7 9 11
      7
    expected_output: |
      3
  - input: |
      6
      1 3 5 7 9 11
      4
    expected_output: |
      -1
