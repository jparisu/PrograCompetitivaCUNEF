<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 224" role="img"
     aria-label="Grafo dirigido con pesos y su árbol de caminos más cortos desde el nodo 0">
  <style>
    /* currentColor follows the OS light/dark scheme (SVG loaded as an image). */
    svg { color: #1b2733; }
    @media (prefers-color-scheme: dark) { svg { color: #cfd8e3; } }
    .edge      { fill: none; stroke: currentColor; stroke-width: 1.6; opacity: 0.38; }
    .edge.tree { stroke: #ec6607; stroke-width: 2.4; opacity: 1; }
    .node      { fill: #ffffff; stroke: currentColor; stroke-width: 1.8; }
    @media (prefers-color-scheme: dark) { .node { fill: #232a33; } }
    .node.src  { stroke: #ec6607; stroke-width: 2.4; }
    .id        { font: 700 15px sans-serif; text-anchor: middle; fill: currentColor; }
    .wt        { font: 700 12px sans-serif; text-anchor: middle; fill: currentColor; }
    .dst       { font: 700 11px sans-serif; text-anchor: middle; fill: #ec6607; }
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor" opacity="0.5"/>
    </marker>
    <marker id="ahT" markerWidth="10" markerHeight="10" refX="8" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ec6607"/>
    </marker>
  </defs>

  <!-- edges (orange = shortest-path tree from node 0) -->
  <line class="edge tree" x1="72.7"  y1="105.8" x2="156.9" y2="62.0"  marker-end="url(#ahT)"/>
  <line class="edge"      x1="72.7"  y1="124.2" x2="156.9" y2="168.0" marker-end="url(#ah)"/>
  <line class="edge tree" x1="180"   y1="70"    x2="180"   y2="154"   marker-end="url(#ahT)"/>
  <line class="edge tree" x1="198"   y1="58.7"  x2="291.6" y2="103.7" marker-end="url(#ahT)"/>
  <line class="edge"      x1="198"   y1="171.3" x2="291.6" y2="126.3" marker-end="url(#ah)"/>
  <line class="edge tree" x1="335"   y1="115"   x2="404"   y2="115"   marker-end="url(#ahT)"/>

  <!-- edge weights -->
  <text class="wt" x="120.8" y="95.4">2</text>
  <text class="wt" x="108.8" y="157.6">5</text>
  <text class="wt" x="167"   y="112">1</text>
  <text class="wt" x="239.2" y="92.9">2</text>
  <text class="wt" x="250.4" y="160.5">3</text>
  <text class="wt" x="369.5" y="108">1</text>

  <!-- nodes -->
  <circle class="node src" cx="55"  cy="115" r="18"/>
  <circle class="node"     cx="180" cy="50"  r="18"/>
  <circle class="node"     cx="180" cy="180" r="18"/>
  <circle class="node"     cx="315" cy="115" r="18"/>
  <circle class="node"     cx="430" cy="115" r="18"/>
  <text class="id" x="55"  y="120">0</text>
  <text class="id" x="180" y="55">1</text>
  <text class="id" x="180" y="185">2</text>
  <text class="id" x="315" y="120">3</text>
  <text class="id" x="430" y="120">4</text>

  <!-- resulting shortest distances from node 0 -->
  <text class="dst" x="55"  y="91">d=0</text>
  <text class="dst" x="180" y="27">d=2</text>
  <text class="dst" x="180" y="208">d=3</text>
  <text class="dst" x="315" y="91">d=4</text>
  <text class="dst" x="430" y="91">d=5</text>
</svg>
