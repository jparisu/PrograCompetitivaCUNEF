<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" role="img"
     aria-label="Dos bucles anidados de tamaño n ejecutan el cuerpo interno n por n veces">
  <style>
    .cell { fill: rgba(236, 102, 7, 0.15); stroke: #ec6607; stroke-width: 1.5; }
    .lbl  { font: 12px sans-serif; text-anchor: middle; fill: currentColor; }
    .idx  { font: 12px sans-serif; text-anchor: middle; fill: currentColor; opacity: 0.7; }
    .axis { font: 700 13px sans-serif; text-anchor: middle; fill: #ec6607; }
  </style>

  <!-- j axis (columns) -->
  <text class="axis" x="164" y="20">j  (bucle interior)</text>
  <text class="idx" x="92"  y="42">0</text>
  <text class="idx" x="140" y="42">1</text>
  <text class="idx" x="188" y="42">2</text>
  <text class="idx" x="236" y="42">3</text>

  <!-- i axis (rows) -->
  <text class="axis" x="24" y="145" transform="rotate(-90 24 145)">i  (bucle exterior)</text>
  <text class="idx" x="58" y="77">0</text>
  <text class="idx" x="58" y="125">1</text>
  <text class="idx" x="58" y="173">2</text>
  <text class="idx" x="58" y="221">3</text>

  <!-- 4x4 grid: one cell = one execution of the inner body -->
  <g>
    <rect class="cell" x="70"  y="50"  width="44" height="44" rx="4"/>
    <rect class="cell" x="118" y="50"  width="44" height="44" rx="4"/>
    <rect class="cell" x="166" y="50"  width="44" height="44" rx="4"/>
    <rect class="cell" x="214" y="50"  width="44" height="44" rx="4"/>

    <rect class="cell" x="70"  y="98"  width="44" height="44" rx="4"/>
    <rect class="cell" x="118" y="98"  width="44" height="44" rx="4"/>
    <rect class="cell" x="166" y="98"  width="44" height="44" rx="4"/>
    <rect class="cell" x="214" y="98"  width="44" height="44" rx="4"/>

    <rect class="cell" x="70"  y="146" width="44" height="44" rx="4"/>
    <rect class="cell" x="118" y="146" width="44" height="44" rx="4"/>
    <rect class="cell" x="166" y="146" width="44" height="44" rx="4"/>
    <rect class="cell" x="214" y="146" width="44" height="44" rx="4"/>

    <rect class="cell" x="70"  y="194" width="44" height="44" rx="4"/>
    <rect class="cell" x="118" y="194" width="44" height="44" rx="4"/>
    <rect class="cell" x="166" y="194" width="44" height="44" rx="4"/>
    <rect class="cell" x="214" y="194" width="44" height="44" rx="4"/>
  </g>

  <text class="lbl" x="164" y="248">n filas &#215; n columnas = n&#178; ejecuciones</text>
</svg>
